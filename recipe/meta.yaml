{% set name = "napari-proofread-brainbow" %}
{% set version = "0.3.3" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name | replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 9d91f0c2b2911992b6df3ecaded60f90ed1273e563466d4e33fda9756e9c7d97

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv
  script_env:
    - QT_QPA_PLATFORM=offscreen

requirements:
  host:
    - pip
    - python >=3.8
  run:
    - magicgui
    - napari
    - numpy
    - python >=3.8
    - qtpy

test:
  imports:
    - napari_proofread_brainbow
  commands:
    - pip list
    - pip check
  requires:
    - pip

about:
  home: https://pypi.org/project/napari-proofread-brainbow/
  summary: proofreading Brainbow images with napari
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - jaimergp
